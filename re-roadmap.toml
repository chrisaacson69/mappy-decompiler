# re-roadmap.toml: where Mappy stands, read by `py -3.14 -m emu_harness status game-annotation/mappy`.
# Phases and gates: emu-harness PHASES.md. First filled 2026-10-26 from the chapters, the open-threads
# notes and emu-harness MIGRATION.md (the build tool's first trial project).

[project]
name    = "Mappy (Japan)"
track   = "native"
machine = "nes"
profile = ""
entry   = ["README.md", "09-from-scratch-rederivation.md", "NOTES-open-threads.md"]

[phase.classify]
status   = "done"
gate     = "Native, real-time: a vblank-synced frame loop ($C06D) driving word-table JMP (ind) dispatch (object states $DA42 x23, game mode $C356 x20). NROM-128 (mapper 0), so the static-runtime join is free."
checked  = "2026-10-26"
toolset  = "aba120d"
evidence = ["01-reset-and-frame-structure.md", "09-from-scratch-rederivation.md"]

[phase.recon]
status   = "done"
gate     = "machines.nes.memory.Cart: mapper 0, PRG 16 KiB, no battery, vertical mirroring; vectors NMI $C2EF, RESET $C031, IRQ $C304 (same as ch1/ch9). One fixed PRG bank, so no windows to vote."
checked  = "2026-10-26"
toolset  = "aa8fa5a"
evidence = ["01-reset-and-frame-structure.md", "repo_header.bin", "repo_CHR_ROM.chr"]

[phase.discover]
status   = "done"
gate     = "Trace 5,024 B (30.7%) -> descent 60.2% -> 7 dispatch tables incl. the $F6A9 inline table (18 handlers, new) -> 275 routines, 10,843 B (66.2%); code recall vs the published disassembly 99.4% (was 96.9%; graded after, never an input). Walker conflicts 4, unexplained 0 (3 bit-skip $F746/$F761/$F77C, 1 dead-path $CC41). Tables end at evidence ($C356 x19, $C13E x1: the old 20th/2nd words were the next routine's bytes). Stored-pointer installs 0 (the 4 old ones were data pointers, counters, a mis-pair). Phantoms $EEA9, $FA3F dropped."
checked  = "2026-10-26"
toolset  = "4eb3022"
evidence = ["conflicts.txt", "jump_tables.txt", "data_ptr_tables.txt", "routines_full.txt", "coverage_full2.bin", "stored_pointers.py"]

[phase.data]
status   = "done"
gate     = "Oracle lanes, all by running or reading the game's own code: strings = the 4 text writers run headless over every table index (rom_data.py; FONT checked twice: CHR atlas + ALL RIGHTS RESERVED in PRG); manual: none exists for this title; ROM data map: 3,996 of 5,541 non-code PRG bytes claimed by walker runs, the attract demo, the sound engine per voice (25 voices) and known tables; hot globals: var_xref now decodes discover's instruction starts only (570 of 1,715 old var-routine links were data read as code). Record schema: one template, offsets proven by code + the demo (x/y 8.8 pairs: carry test 693/693 and the draw code; +4 draw index, +F state, by their dispatch loads), the rest field+N; the 9 per-address duplicates dropped, .mlb has no conflicts."
checked  = "2026-10-26"
toolset  = "4eb3022"
evidence = ["rom_data.py", "rom_data.txt", "vars.toml", "var_xref.py", "obj_record.py"]

[phase.structure]
status   = "done"
gate     = "One typed call graph on discover's routines (call_graph.py on passes.callgraph.Graph): each routine walked by descent.flow with every other entry as a stop, never a span sweep. 275 routines, 535 edges: call 290, jmp 113, flows-into 195 (falls or branches into another entry; dead paths past an always-taken branch excluded by passes.native.dead_path), dispatch 53, inline 18, task 1. Reached from the vectors 275/275 (was 64%). 3 SCCs, all loops: the sound interpreter (21 entries, handlers jump back to $F636), draw dispatch, the game task's stage loop. Graded against Chris's hand tree from RESET/NMI/IRQ (31 parent-child pairs): 27 direct edges, 4 through one flows-into or loop head; two edge bugs it exposed were fixed in the library."
checked  = "2026-10-26"
toolset  = "2f252ef"
evidence = ["call_graph.py", "call_tree.txt", "call_graph.json", "bottom_up_order.txt", "call_tree_page.py"]

[phase.naming]
status   = "partial"
gate     = "258 routines named bottom-up in 8 levels, then a top-down adversarial verify (95% confirmed); the published disassembly read only at the end (it matched every overlap, anonymous on 188). Not met: 9 names carry an address key, 3 phantoms are named."
checked  = "2026-06-25"
toolset  = ""
evidence = ["labels.toml", "vars.toml", "09-from-scratch-rederivation.md"]

[phase.presentation]
status   = "done"
gate     = "Native ladder: mappy_labeled.asm (asm_gen on passes.listing) and Mappy (Japan).mlb (backends.mesen.labels), regenerated from the 2026-10-26 discover: 280 routines, 94 table words (78 before: -2 overrun words, +18 inline), the inline table rendered as .word."
checked  = "2026-10-26"
toolset  = "4eb3022"
evidence = ["mappy_labeled.asm", "Mappy (Japan).mlb", "asm_gen.py", "mappy_mlb.py"]

[phase.assets]
status   = "partial"
gate     = "render_level runs the ROM's own draw routines on the library (cpu.m6502, Bus + PPUPort, Canvas): all 16 rounds' VRAM and pixels identical to the old tool and the committed PNGs. Not met: no check against the live PPU."
