# notes and emu-harness MIGRATION.md (the build tool's first trial project).

[project]
name    = "Mappy (Japan)"
track   = "native"
machine = "nes"
profile = ""
entry   = ["README.md", "09-from-scratch-rederivation.md", "NOTES-open-threads.md"]

[phase.classify]
status   = "done"
gate     = "Native, real-time: a vblank-synced frame loop ($C06D) driving word-table JMP (ind) dispatch (object states $DA42 x23, game mode $C356 x20). NROM-128 (mapper 0), so the static-runtime join is free."
checked  = "2026-10-26"
toolset  = "aba120d"
evidence = ["01-reset-and-frame-structure.md", "09-from-scratch-rederivation.md"]

[phase.recon]
status   = "done"
gate     = "machines.nes.memory.Cart: mapper 0, PRG 16 KiB, no battery, vertical mirroring; vectors NMI $C2EF, RESET $C031, IRQ $C304 (same as ch1/ch9). One fixed PRG bank, so no windows to vote."
checked  = "2026-10-26"
toolset  = "aba120d"
evidence = ["01-reset-and-frame-structure.md"]

[phase.discover]
status   = "partial"
gate     = "Trace 30% -> descent 60% -> idiom jump-table sweep 96.7% code recall, all 6 dispatch tables (incl. bonus $E17A, never executed). Row R re-ran the pipeline on the library: every output identical. Not met: walker conflicts never counted; 3 phantoms carry routine labels."
checked  = "2026-10-26"
toolset  = "aba120d"
evidence = ["coverage_full2.bin", "routines_full.txt", "jump_tables.txt", "09-from-scratch-rederivation.md"]

[phase.data]
status   = "partial"
gate     = "152 variables (var_xref) and the 16-byte object record at $0400 (obj_record = passes.native.field_census; row R identical). Not met: the record and vars.toml disagree on 9 bytes; known mislabels open."
checked  = "2026-10-26"
toolset  = "aba120d"
evidence = ["vars.toml", "obj_record.py", "var_xref.py"]

[phase.structure]
status   = "done"
