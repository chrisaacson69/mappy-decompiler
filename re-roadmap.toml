# re-roadmap.toml: where Mappy stands, read by `py -3.14 -m emu_harness status mappy-decompiler`.
# The chapters and open-threads notes live in the sibling game-annotation repo (mappy/); paths below
# that start ../game-annotation/mappy/ point there.
# Phases and gates: emu-harness PHASES.md. First filled 2026-10-26 from the chapters, the open-threads
# notes and emu-harness MIGRATION.md (the build tool's first trial project).

[project]
name    = "Mappy (Japan)"
track   = "native"
machine = "nes"
profile = ""
entry   = ["../game-annotation/mappy/README.md", "../game-annotation/mappy/10-build-tool-pass.md", "../game-annotation/mappy/09-from-scratch-rederivation.md", "../game-annotation/mappy/NOTES-open-threads.md"]

[phase.classify]
status   = "done"
gate     = "Native, real-time: a vblank-synced frame loop ($C06D) driving word-table JMP (ind) dispatch (object states $DA42 x23, game mode $C356 x20). NROM-128 (mapper 0), so the static-runtime join is free."
checked  = "2026-10-26"
toolset  = "aba120d"
evidence = ["../game-annotation/mappy/01-reset-and-frame-structure.md", "../game-annotation/mappy/09-from-scratch-rederivation.md"]

[phase.recon]
status   = "done"
gate     = "machines.nes.memory.Cart: mapper 0, PRG 16 KiB, no battery, vertical mirroring; vectors NMI $C2EF, RESET $C031, IRQ $C304 (same as ch1/ch9). One fixed PRG bank, so no windows to vote."
checked  = "2026-10-26"
toolset  = "aa8fa5a"
evidence = ["../game-annotation/mappy/01-reset-and-frame-structure.md", "repo_header.bin", "repo_CHR_ROM.chr"]

[phase.discover]
status   = "done"
gate     = "Trace 5,024 B (30.7%) -> descent 60.2% -> 8 dispatch tables incl. the $F6A9 inline table (18 handlers) and the $EA39 stub table (4 door handlers, behind the shared JMP ($001C) at $EA46) -> 280 routines, 10,906 B (66.6%); code recall vs the published disassembly 100.0% (10,754/10,754; was 99.4%, the missing 0.6% was the stub table's handlers; graded after, never an input). Hole check: a Mesen CDL over three play logs (cdl_gap.py, ~15,000 frames) finds 0 executed bytes the listing does not decode (was 63, $EA51-$EA8F). Walker conflicts 4, unexplained 0 (3 bit-skip $F746/$F761/$F77C, 1 dead-path $CC41). Tables end at evidence ($C356 x19, $C13E x1: the old 20th/2nd words were the next routine's bytes). Stored-pointer installs 0 (the 4 old ones were data pointers, counters, a mis-pair). Phantoms $EEA9, $FA3F dropped."
checked  = "2026-10-26"
toolset  = "39da66b"
evidence = ["conflicts.txt", "jump_tables.txt", "data_ptr_tables.txt", "routines_full.txt", "coverage_full2.bin", "stored_pointers.py", "cdl_gap.py"]

[phase.data]
status   = "done"
gate     = "Oracle lanes, all by running or reading the game's own code: strings = the 4 text writers run headless over every table index (rom_data.py; FONT checked twice: CHR atlas + ALL RIGHTS RESERVED in PRG); manual: none exists for this title; ROM data map: 4,004 of 5,478 non-code PRG bytes claimed (re-run after the $EA39 table: was 3,996 of 5,541) by walker runs, the attract demo, the sound engine per voice (25 voices) and known tables; hot globals: var_xref now decodes discover's instruction starts only (570 of 1,715 old var-routine links were data read as code). Record schema: one template, offsets proven by code + the demo (x/y 8.8 pairs: carry test 693/693 and the draw code; +4 draw index, +F state, by their dispatch loads), the rest field+N; the 9 per-address duplicates dropped, .mlb has no conflicts."
checked  = "2026-10-26"
toolset  = "39da66b"
evidence = ["rom_data.py", "rom_data.txt", "vars.toml", "var_xref.py", "obj_record.py"]

[phase.structure]
status   = "done"
gate     = "One typed call graph on discover's routines (call_graph.py on passes.callgraph.Graph): each routine walked by descent.flow with every other entry as a stop, never a span sweep. 280 routines, 542 edges: call 290, jmp 114, flows-into 198 (falls or branches into another entry; dead paths past an always-taken branch excluded by passes.native.dead_path), dispatch 57 (4 from a JSR to the $EA46 stub), inline 18, task 1. Reached from the vectors 280/280 (was 64%). 3 SCCs, all loops: the sound interpreter (21 entries, handlers jump back to $F636), draw dispatch, the game task's stage loop. Graded against Chris's hand tree from RESET/NMI/IRQ (31 parent-child pairs): 27 direct edges, 4 through one flows-into or loop head; two edge bugs it exposed were fixed in the library."
checked  = "2026-10-26"
toolset  = "39da66b"
evidence = ["call_graph.py", "call_tree.txt", "call_graph.json", "bottom_up_order.txt", "call_tree_page.py"]

[phase.naming]
status   = "done"
gate     = "2026-10-26 pass on the fixed discover, three batches through apply_names.py (walk.guard name mapping + every listing byte unchanged; a failed batch restores labels.toml): 26 renames, 21 new labels (the 18 sound opcodes, run_voice_stream, 2 dead routines). Bottom-up: the two threads (start_game_thread, yield_to_render_loop), the sound engine (25 voices; every stream ends in opcode $E8 or $F9, checked on the sound-lane extents), draw_rle_text, 7 address-keyed names by role. Top-down: the render thread (RESET, NMI, IRQ without the task edge, 54 routines) verified; 6 renamed (render_loop, swap_player_state, nmi_count_vblank, flush_dirty_attribute_bytes, ...). Game thread top-down started the same day, chunks 1-3 (skeleton, per-frame update, score and HUD, the sprite path): 28 routines, 17 variables, each proven by code and where possible by data (the 1UP/2UP packets and PAUSE / PLAYER / GAME OVER / READY decoded from the CHR rows; the score blocks preserved across soft reset). The object state machine the same day (batch through apply_names.py, guard clean): 42 renames, 5 new labels. The 21 non-noop handlers named stateNN_<role>, plus the shared transitions (enter_fall, land_on_floor, start_hop, land_on_trampoline, catch_player_or_knock_out), the doors (player_opens_nearest_door, open_door, door_kindN_knock_back, walker_meets_closed_door), the door wave and the dropped objects. Evidence: each handler's code plus state_census.py over 3 play logs (per-state durations, movement and successors; every state write with its writer PC, which found the $EA51 discover hole). Graded after against the published disassembly's 13 state comments: no disagreement; 10 states it leaves blank are named here. The bonus-round table $E17A next (12 renames): no play log reaches a bonus round, so state_census.py got --poke (130:7A=01 warps clearing round 1 into the round-3 bonus round; a player warp onto slot 1's goal object reached states 0E -> 12); bonus falls end the round instead of killing. Graded after against con_bonus_state_*: 10/10 agree, incl. state 10 'unused' (no writer found here). Game thread chunks 4-5 the same day: round setup (30 renames, 4 checked keeps: stage params $63-$68, the fixed 10-item set and its pair streak, doors as what differs per round, trampolines' 3 bounces, the round timer's phases (a census with its limits poked to 1 s / 2 s brought the extra cat and slot 1 as type 1), the sprite texts PLAYER n / READY / GAME OVER read from mappy.chr) and the frame updaters (31: trampoline and door animation, door waves and their count score, floor traps in rounds 12-14 (code only), bonus targets, set_object_intent). apply_names.py records a checked keep. Chunks 6-9: physics (23: hop arc +B/+C, object_speed, the tile read-back through $04C0 into +8, cat targeting with a ROM-byte RNG, slot 2's patrol, trampolines heal on landing), flows (14 + dead $D762, an unreachable invincibility toggle of $2E), the draw path by anim value (24), leaves (3 renames, 9 checked keeps). The game thread's 234 routines are all checked. The 34 render-thread / reset / sound routines were checked by the earlier pass (gate above) but carry no per-label marker. Second round, the ROM data (data walk, 2026-10-26): data_frontier.py (every abs operand into undecoded PRG, by base, with its named readers) went from 58 unlabeled elements to 0 (5 more are fields of a labelled record); data_pointers.py named the 106 blobs reached only through those pointer tables (counts proven by the readers), plus knockout_score_offsets ($DB33,x indexes past a jmp operand) and unreferenced_e788. 166 data labels; 3 data runs started without a label, now 1 (a field). The listing now starts at $C000 (the copyright was missing) and shows the 6502 vectors as .word. HURRY named (Chris). Variables round 2 the same day: no shared names, 5 unnamed touched addresses, each explained. The symbol files are valid TOML, read by one tomllib loader. Called done by Chris 2026-10-26 (no placeholder names, no open revisits; generic-but-correct names stay where the role is only provenance). The assets the names point at (sound, pictures, text in the listing) are the Assets phase."
checked  = "2026-10-26"
toolset  = "39da66b"
evidence = ["labels.toml", "apply_names.py", "mappy_labeled.asm", "call_tree.txt", "call_tree.html", "state_census.py"]

[phase.presentation]
status   = "done"
gate     = "Native ladder: mappy_labeled.asm (asm_gen on passes.listing) and Mappy (Japan).mlb (backends.mesen.labels), regenerated from the 2026-10-26 discover: 280 routines, 94 table words (78 before: -2 overrun words, +18 inline), the inline table rendered as .word. Regenerated again after the $EA39 stub table: 301 labelled routines (asm_gen's count, labels included), 98 table words (+4 at $EA49), $EA51-$EA8F decoded. 2026-10-27: asm_gen prints listing_art.json under each label (ASCII art, decoded text); the listing starts at $C000 and the vectors are .word."
checked  = "2026-10-26"
toolset  = "39da66b"
evidence = ["mappy_labeled.asm", "Mappy (Japan).mlb", "asm_gen.py", "mappy_mlb.py"]

[phase.assets]
status   = "done"
gate     = "render_level runs the ROM's own draw routines on the library (cpu.m6502, Bus + PPUPort, Canvas): all 16 rounds' VRAM and pixels identical to the old tool and the committed PNGs.  Chris checked the 16 round renders by eye (2026-10-26): correct, in the game's own palette captured at $3F00 (the CHR atlas PNG, a one-off with no generator, uses a placeholder palette). Sound (2026-10-27): sound_capture.py runs the game's own engine headless per voice and records every APU write; sound_verify.py replays a play log's game-side triggers, engine resets and ticks (cycle order, from Mesen watches) and the APU stream matches Mesen write for write (14,045 writes, 5,032 frames). emu_harness.machines.nes.apu (nesdev-grounded, tested against its formulas) renders one WAV per event (14, from the snd_* triggers; held triggers as long as the game holds them, measured from its writes: HURRY 125 frames, the door wave 123, round music for good, rendered as two of its 768-frame loops; trimmed to the sound, normalized to -1 dBFS); voices 14-16 are the bonus round music (one trigger at the intro, 2,446 frames = intro 210 + limit 2,220); the note table is a chromatic octave A1-G#2 within 3 cents, and the rendered round music's pitches land on it (median 7.7 cents). Chris listened 2026-10-27: they sound right. Pictures (2026-10-27): render_assets.py draws every labelled picture with draw_rle_text and every sprite pose with draw_object, headless, in the game's own palettes (the sprite palette only the title's draw block writes): 48 pictures (items, doors, trampolines in their wear colours, floor traps, bonus targets, the results lines) and 35 distinct poses. Names from the pictures (Chris confirmed): bells, the goal balloon and Goro, balloons, the five items, the namco logo; types 0 Mappy, 1 the coin, 2 Goro, 3 the Meowkies. The listing carries the assets: render_assets.py --art writes listing_art.json (54 entries: ASCII art of each picture and of each draw handler's first pose, the decoded string of each text blob, the copyright and title text) and asm_gen prints it under each label; the byte stream is unchanged. Live PPU (2026-10-27, assets_verify.py --suite): just after each round type's load (rounds 1, 8, 12, bonus 3; frames from Mesen exec watches on the loaders), the live nametables and palette RAM equal the same round loaded headless by next_round's own loaders plus the per-frame drawers' last 16 frames: 2,048 of 2,048 bytes and 32 of 32 entries, each run; Mesen's screenshot equals the library's frame() of the live VRAM/OAM pixel for pixel (one-to-one colour map, 240 of 240 rows, 5 runs incl. a moved camera). Found on the way, now in the library (emu-harness 454ec4a): the timed HUD split (scroll 0 in vblank at $C1A7, the camera at $C092, measured on scanline 34, so line 35) and the hardware's sprite priority (a behind sprite hides the sprites under it). Planted fault (the wave-door blink tile 52 -> 53 in the headless ROM): caught at the 4 wave doors. Beyond the gate, not done: the synthesizer's output against a Mesen audio recording (the APU writes are verified; the rendering only against the nesdev formulas and by ear)."
checked  = "2026-10-27"
toolset  = "454ec4a"
evidence = ["render_level.py", "mappy_levels_contact.png", "sound_capture.py", "sound_verify.py", "render_assets.py", "assets_verify.py"]

[phase.live]
status   = "done"
gate     = "demo_in_real_game replays the attract script frame-exact through the pad on Mesen (read_trace, row P2: 34 lines identical); seed_test measured the frame-counter phase. Gate (2026-10-27, live_verify.py --suite, rerun on emu-harness 454ec4a): the per-object step of update_and_respawn_objects ($D8E0: set_object_intent, dispatch_object_state and every state handler under it, draw_object) runs headless (cpu.m6502 over machines.nes.bus) from each live RAM dump (Mesen exec watches at $D8E0 / $D8F4, all 2 KB each hit) and must reproduce the next one byte for byte, stack page aside; NMI-crossing steps would be skipped and counted. 10 runs (3 play logs, plus poked warps for bonus round 3, the goal balloon, HURRY and the extra cat, rounds 8 and 12, broken trampolines): 425,547 steps identical, 0 different, 0 skipped; every reachable state seen (normal 02-2C, bonus 00-12 except 10, which no instruction writes). Planted fault (walk_step adc #$01 -> #$02 at $DEFD): 6,431 of 33,876 steps differ, caught."
checked  = "2026-10-27"
toolset  = "454ec4a"
evidence = ["demo_in_real_game.py", "seed_test.py", "live_verify.py"]

