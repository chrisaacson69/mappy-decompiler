[phase.live]
status   = "partial"
gate     = "demo_in_real_game replays the attract script frame-exact through the pad on Mesen (read_trace, row P2: 34 lines identical); seed_test measured the frame-counter phase. Not met: no routine run over live RAM for every input with a planted fault."
