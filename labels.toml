kind = "data"
conf = "HIGH"
why = "tbl_palhud_ptr[Y=0]; palhud_idx 0 (not selected by any round; title/HUD-header context per ch8). [count][ppu_addr_hi][ppu_addr_lo][tiles..][0-term] blocks."

