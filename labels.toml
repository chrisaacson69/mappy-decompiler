name = "tbl_round_attributes"
kind = "data"
conf = "HIGH"
why = "Level-design-as-data: 16 rounds x 4 bytes [bonus, palhud_idx, item_idx, mansion_idx], read at round*4 by build_stage_screen_layout ($CD56 lda $cdbf,x). byte0!=0 marks the bonus rounds 2/6/10/14 (values $02/$04/$06/$08). bytes 1-3 are Y-offset selectors into tbl_palhud_ptr/tbl_frameitem_ptr/tbl_mansion_ptr. Chapter 8's '64 bytes = the whole game's level design'."

[[label]]
addr = "CC41"
name = "tbl_palhud_ptr"
kind = "data"
conf = "HIGH"
why = "5x 2-byte LE pointers to palhud_block_* draw-command blobs ($CC4B/$CC60/$CCEF/$CD03/$CD17). Indexed by palhud_idx (round-attr byte1) via ppu_run_draw_blocks ($CC15: lda $cc41,y). Palette/HUD/title template layer."

[[label]]
addr = "CFA6"
name = "tbl_frameitem_ptr"
kind = "data"
conf = "HIGH"
why = "6x 2-byte LE pointers to frameitem_block_* blobs ($CFB2..$D0C5). Indexed by item_idx (round-attr byte2) and by a constant Y=8 (the fixed playfield frame) via ppu_draw_blocks_b ($CF69: lda $cfa6,y). Frame + item-tile placement layer (items are nametable tiles)."

[[label]]
addr = "D185"
name = "tbl_mansion_ptr"
kind = "data"
conf = "HIGH"
why = "7x 2-byte LE pointers to mansion_block_* RLE stamp blobs ($D193..$D483). Indexed by mansion_idx (round-attr byte3), plus Y=$0C (bonus mansion frame) via ppu_draw_mansion_stamps ($D126: lda $d185,y). Mansion floor/wall/door structure layer."

